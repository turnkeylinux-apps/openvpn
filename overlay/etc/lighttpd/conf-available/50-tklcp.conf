server.modules += ( "mod_accesslog" )
mimetype.assign += ( ".ovpn" => "application/x-openvpn-profile" )

# TLS listeners and the HTTP-to-HTTPS redirect are provided by the shared
# hardened 10-ssl.conf.  Keep the appliance root independent of the listener
# address so it also applies when lighttpd reports a concrete local address.
# Core defines generic global defaults first; ':=' intentionally replaces
# those defaults for this dedicated appliance.
server.document-root := "/var/www/openvpn/htdocs/"
accesslog.filename = "/var/www/openvpn/logs/access.log"
server.errorfile-prefix := server.document-root
